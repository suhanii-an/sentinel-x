name: CI

# The gate, not a formality. A green run means: the backend lints and its 377
# tests pass on both SQLite and Postgres; the frontend lints, typechecks, builds
# and its 24 browser tests pass against a real backend; every shipped detection
# rule passes its own positive and negative cases; and no dependency has a known
# critical advisory.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs on both because the ORM layer is dialect-neutral by
        # design and a dialect bug — a JSON predicate that silently matches
        # nothing on one engine — is the kind that ships quietly.
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinelx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-signing-key-not-used-for-anything-real
      AI_PROVIDER: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://sentinel:ci-only-password@localhost:5432/sentinelx_test' || '' }}
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Verify migrations produce the same schema as the models
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sentinel:ci-only-password@localhost:5432/sentinelx_test
        run: |
          alembic upgrade head
          # A model change with no migration is a deployment that works in
          # development and fails on the first real upgrade.
          alembic check

      - name: Upload coverage
        if: matrix.database == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  detection-rules:
    name: Detection rules
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-signing-key-not-used-for-anything-real
      AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Every rule loads and passes its own tests
        working-directory: backend
        run: |
          python - <<'PY'
          import sys
          from app.core.config import settings
          from app.detection.rules import load_rules
          from app.detection.testing import run_all_rule_tests

          rules, errors = load_rules(settings.rules_path)
          if errors:
              print("Rule pack failed to load:")
              for error in errors:
                  print(f"  {error}")
              sys.exit(1)

          summary = run_all_rule_tests(rules)
          failures = [r for r in summary.results if not r.passed]
          print(f"{len(rules)} rules, {summary.total} tests, {summary.passed} passed")
          for failure in failures:
              print(f"  FAIL {failure.rule_id}/{failure.test_name}: {failure.detail}")

          # A rule with no negative case has never been checked for noise.
          silent = [
              r.id for r in rules
              if not any(t.expect == "no_match" for t in r.tests)
          ]
          if silent:
              print(f"Rules with no negative test case: {silent}")

          sys.exit(1 if failures or silent else 0)
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          cd frontend && npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        # Playwright starts both servers: a seeded throwaway SQLite backend and
        # `vite preview` serving the production build, so these exercise the
        # bundle that actually ships.
        run: npm test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          # Advisory data changes daily and a new CVE in a transitive
          # dependency should not turn an unrelated pull request red, so this
          # reports rather than blocks. The report is in the job log.
          pip-audit -r requirements.txt || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: No secrets in the working tree
        run: |
          # A committed .env is the failure this repository most needs to avoid,
          # and unlike an advisory it is unambiguous, so this one does block.
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.p12$|_rsa$'; then
            echo "A credential file is tracked in git."
            exit 1
          fi
          echo "No credential files tracked."

  docker:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
