# Security headers for the analyst console.
#
# Kept in a file because nginx replaces rather than merges add_header across
# levels: any location that declares one header drops every header declared
# above it. Including this file everywhere makes that behaviour harmless.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Enabled by the deployment that terminates TLS, not by this container.
# Left commented rather than absent so it is a decision, not an oversight.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
