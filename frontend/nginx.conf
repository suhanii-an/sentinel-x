# Serves the analyst console and proxies the API from the same origin.
#
# Same-origin is the point: the browser never makes a cross-origin request, so
# there is no CORS configuration to get wrong and no preflight surface. The
# token lives in sessionStorage on this origin, and the CSP below is what
# limits what a script on this origin could do with it.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version.
    server_tokens off;

    # ------------------------------------------------------------- security
    #
    # These live in an include rather than at server level because nginx's
    # add_header is *replaced*, not merged, by any location that declares its
    # own. A `location = /index.html` that sets Cache-Control would otherwise
    # silently drop every header below — on the one resource the browser parses
    # as HTML, which is exactly where they matter. So every location that adds
    # a header of its own re-includes this file.
    #
    # The console is a single bundle with no third-party scripts, no inline
    # event handlers and no remote fonts, so everything but 'self' is denied.
    # 'unsafe-inline' appears once, for style: the chart library injects inline
    # styles for computed dimensions and there is no way to nonce them. Scripts
    # are not exempted, which is the half that matters.
    include /etc/nginx/security-headers.conf;

    # ------------------------------------------------------------ API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, never appended.
        #
        # $proxy_add_x_forwarded_for would append $remote_addr to whatever the
        # client sent, and the API reads the *leftmost* entry as the client
        # address. A caller could then set the header themselves and reset the
        # sign-in throttle at will, and write a forged address into the
        # append-only audit log. The backend documents that it trusts this
        # header only because it expects a proxy that overwrites it; this is
        # that proxy, so it overwrites it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An evaluation run or a full-chain simulation takes tens of seconds.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # No `include` here on purpose: the API sets its own (stricter,
        # JSON-appropriate) headers, and a second Content-Security-Policy
        # header is not merged by browsers — the most restrictive of the two
        # wins in confusing ways. Declaring nothing at this level means nothing
        # is inherited either, because the location has no add_header of its
        # own to trigger inheritance.
    }

    # --------------------------------------------------------------- assets
    # Fingerprinted filenames, so they can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current bundle.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    # try_files' final argument is an internal redirect, so every SPA route is
    # served through the `= /index.html` block above and picks up its headers.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Bodies are bounded here as well as in the API, so an oversized upload is
    # rejected at the edge rather than after it has crossed the network twice.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
